<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="YardDesk demo for Strong Wall: fuel, repairs, scheduling, concrete tracking and daily logs in one app.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>YardDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: yard-office console. Left rail of departments on desktop, scrolling tab strip on phones (drivers use phones). Hi-vis amber marks what needs action. */
:root{
  --bg:#EFEFEB; --surface:#FFFFFF; --sunk:#F6F6F3; --ink:#1D2125; --muted:#5B636A; --line:#D9DBD6;
  --accent:#F2A900; --accent-ink:#1D2125; --accent-soft:#FDF1CF;
  --ok:#2D7A4E; --ok-soft:#E3F1E8; --warn:#A86200; --warn-soft:#FBEBD2; --bad:#B8322A; --bad-soft:#F8E1DF;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1C2024; --sunk:#181B1F; --ink:#ECEDEA; --muted:#9BA2A8; --line:#2C3237;
  --accent:#FFB81C; --accent-ink:#14171A; --accent-soft:#3A2F12;
  --ok:#5DBB85; --ok-soft:#1C3326; --warn:#F0A43A; --warn-soft:#3A2A12; --bad:#F07068; --bad-soft:#3D1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --sunk:#181B1F; --ink:#ECEDEA; --muted:#9BA2A8; --line:#2C3237;
  --accent:#FFB81C; --accent-ink:#14171A; --accent-soft:#3A2F12;
  --ok:#5DBB85; --ok-soft:#1C3326; --warn:#F0A43A; --warn-soft:#3A2A12; --bad:#F07068; --bad-soft:#3D1F1D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--ink) 6px 12px);flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;line-height:1}.brand h1 span{color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.app{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 60px)}
nav.rail{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav.rail button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;color:var(--muted)}
nav.rail button:hover{background:var(--sunk);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav.rail .badge{margin-left:auto}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;width:100%}
@media (min-width:861px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  nav.rail button{white-space:nowrap;padding:8px 12px}
  nav.rail button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
}

h2.view{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.02em;margin:0 0 10px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:980px){.cols-2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin-top:4px}
.kpi .val .u{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);margin-left:4px}
.kpi .eyebrow{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.kpi .foot{color:var(--muted);font-size:13px;margin-top:2px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--sunk);border-left:4px solid var(--muted)}
.alert.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.alert.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.alert.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.alert b{font-weight:600}
.alert .go{margin-left:auto;white-space:nowrap}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}

.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:64px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);opacity:.82}
.bar .fill.hot{background:var(--accent);opacity:1}

form.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.45}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

.tickets{display:flex;flex-direction:column;gap:10px}
.ticket{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;min-width:0}
.ticket.p-critical{border-left-color:var(--bad)} .ticket.p-high{border-left-color:var(--warn)} .ticket.p-medium{border-left-color:var(--accent)} .ticket.p-low{border-left-color:var(--muted)}
.ticket .t{font-weight:600}
.ticket .meta{font-size:13px;color:var(--muted)}
.ticket .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.ticket .ctl select,.ticket .ctl input{width:auto}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;text-align:center;min-width:64px}
.day b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.day span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.mine{box-shadow:inset 3px 0 0 var(--accent)}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;grid-column:1/-1}
.check{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);font-size:14px}
.check .seg{flex:none}
.check>span{min-width:0}
.check .seg button{padding:4px 10px;font-size:12px}
.check .seg button.def[aria-pressed="true"]{background:var(--bad);color:#fff}

.chat{display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:60vh;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:min(680px,92%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.askbar{display:flex;gap:8px;margin-top:8px}
.askbar input{flex:1}

.kb{display:flex;flex-direction:column;gap:12px}
.kbitem{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
nav.rail .lbl{display:flex;flex-direction:column;line-height:1.25}
nav.rail .lbl small{font-size:12px;font-weight:400;color:var(--muted)}
@media (max-width:860px){nav.rail .lbl small{display:none}}
.help{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin:-6px 0 18px;font-size:14px}
.help dt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:2px}
.help dd{margin:0}
.help dd.now{font-weight:500}
@media (max-width:520px){.help{grid-template-columns:1fr}.help dt{padding-top:6px}}
.welcome{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.welcome h3{font-size:22px;margin-bottom:4px}
.welcome p{margin:0 0 12px;max-width:65ch}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 14px;list-style:none;padding:0;counter-reset:f}
.flow li{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 42px;font-size:14px;counter-increment:f;min-width:0}
.flow li::before{content:counter(f);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center}
.flow li b{display:block}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.flow{grid-template-columns:1fr}}
.firsttime{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.howtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.howto ol{margin:0 0 4px;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.howto ol li::marker{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.howto .note{margin:0 0 8px}
.howto .btn{align-self:flex-start;margin-top:auto}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600}
.faq details p{margin:6px 0 0;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 16px;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour .step{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.7;font-weight:600}
.tour h4{font-family:var(--f-display);font-size:20px;margin:2px 0 4px;font-weight:700}
.tour p{margin:0 0 10px;font-size:14px;opacity:.92}
.tour .row{justify-content:flex-end}
.tour .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
.tour .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tour .btn.link{color:var(--bg);margin-right:auto}
body.touring main{padding-bottom:200px}
.demo-flag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:4px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.panel,.kpi,.ticket{transition:border-color .15s}}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><div><h1>Yard<span>Desk</span></h1><small id="coName">Strong Wall</small></div></div>
  <span class="demo-flag">Demo for Strong Wall · sample data</span>
  <div class="spacer"></div>
  <div class="role"><span>Viewing as</span>
    <div class="seg" role="group" aria-label="Role">
      <button id="roleDriver" type="button">Driver</button>
      <button id="roleAdmin" type="button">Admin</button>
    </div>
    <select id="meSel" aria-label="Driver" style="width:auto"></select>
  </div>
</header>

<div class="app">
  <nav class="rail" id="nav" aria-label="Sections"></nav>
  <main id="main" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tour" id="tour" hidden role="dialog" aria-label="Tour"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=new Date(); TODAY.setHours(12,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayIso=n=>iso(addDays(TODAY,n));
const fmtDate=s=>{const d=new Date(s+"T12:00:00");return d.toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"})};
const money=n=>"$"+Number(n).toLocaleString("en-CA",{minimumFractionDigits:0,maximumFractionDigits:0});
const money2=n=>"$"+Number(n).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2});
const n1=n=>Number(n).toLocaleString("en-CA",{maximumFractionDigits:1});
const n0=n=>Math.round(Number(n)).toLocaleString("en-CA");
const uid=()=>Math.random().toString(36).slice(2,9);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- demo data ---------- */
const CHECK_ITEMS=["Brakes & air pressure","Tires & wheels","Lights & signals","Mirrors & glass","Fluid leaks","Drum & chute","Horn & wipers","Emergency kit"];
function seed(){
  const r=rng(7);
  const R=(a,b)=>a+(b-a)*r();
  const trucks=[
    {id:"M-101",type:"Mixer",cap:10,lastService:0},{id:"M-102",type:"Mixer",cap:10,lastService:0},
    {id:"M-103",type:"Mixer",cap:9,lastService:0},{id:"M-104",type:"Mixer",cap:10,lastService:0},
    {id:"M-105",type:"Mixer",cap:8,lastService:0},{id:"M-106",type:"Mixer",cap:10,lastService:0},
    {id:"D-201",type:"Dump",cap:0,lastService:0},{id:"P-301",type:"Pickup",cap:0,lastService:0}];
  const drivers=["Gurpreet S.","Mike T.","Ana R.","Dev P.","Luis M.","Chris B."];
  const rate={"M-101":.58,"M-102":.61,"M-103":.56,"M-104":.79,"M-105":.53,"M-106":.6,"D-201":.48,"P-301":.16};
  const startOdo={"M-101":168200,"M-102":142900,"M-103":201500,"M-104":187300,"M-105":96400,"M-106":155800,"D-201":122700,"P-301":61200};
  const lastSvc={"M-101":160000,"M-102":129900,"M-103":189000,"M-104":180000,"M-105":91000,"M-106":146500,"D-201":110300,"P-301":52000};
  const fuel=[];
  trucks.forEach((t,ti)=>{
    let odo=startOdo[t.id], since=0, gap=0;
    const drv=drivers[ti%drivers.length];
    for(let d=-14;d<=0;d++){
      const km=Math.round(t.type==="Pickup"?R(60,140):R(110,240));
      if(d<0||t.id!=="M-105"){odo+=km;since+=km}
      gap++;
      if(gap>=(t.type==="Pickup"?4:3)&&d<0||(d===0&&ti%3===0)){
        const litres=Math.round(since*rate[t.id]*R(.95,1.05));
        const price=+(R(1.58,1.66)).toFixed(3);

function fuelStats(){
  const byT={};
  S.trucks.forEach(t=>byT[t.id]={litres14:0,cost14:0,eff:[]});
  const sorted=[...S.fuel].sort((a,b)=>a.odo-b.odo);
  const last={};
  sorted.forEach(f=>{
    const b=byT[f.truck]; if(!b)return;
    if(f.date>=dayIso(-13)){b.litres14+=f.litres;b.cost14+=f.litres*f.price}
    if(last[f.truck]&&f.odo>last[f.truck].odo){f._eff=f.litres/(f.odo-last[f.truck].odo)*100;b.eff.push(f._eff)}
    last[f.truck]=f;
  });
  Object.values(byT).forEach(b=>b.avg=b.eff.length?b.eff.reduce((a,c)=>a+c,0)/b.eff.length:null);
  const mixers=S.trucks.filter(t=>t.type==="Mixer").map(t=>byT[t.id].avg).filter(Boolean);
  const fleetMixer=mixers.length?mixers.reduce((a,c)=>a+c,0)/mixers.length:0;
  return {byT,fleetMixer};
}
function weekFuel(){const from=dayIso(-6);let L=0,C=0;S.fuel.forEach(f=>{if(f.date>=from){L+=f.litres;C+=f.litres*f.price}});return{L,C}}
function concrete(fromIso){let o=0,d=0,r=0;S.jobs.forEach(j=>{if(j.date>=fromIso&&j.date<=dayIso(0)&&j.delivered!=null){o+=j.ordered;d+=j.delivered;r+=j.returned||0}});return{o,d,r,w:o?r/o*100:0}}

    concreteLast7d:{orderedM3:+c.o.toFixed(1),deliveredM3:+c.d.toFixed(1),returnedM3:+c.r.toFixed(1),wastePct:+c.w.toFixed(1)},
    jobs:S.jobs.filter(j=>j.date>=dayIso(-6)).map(j=>({date:j.date,time:j.time,site:j.site,mix:j.mix,truck:j.truck,driver:j.driver,ordered:j.ordered,delivered:j.delivered,returned:j.returned,status:j.status})),

function localAnswer(q){
  const t=q.toLowerCase(); const fs=fuelStats();
  const unit=(q.match(/\b([MDP]-?\d{3})\b/i)||[])[1]; const u=unit?unit.toUpperCase().replace(/^([MDP])(\d)/,"$1-$2"):null;
  if(/fuel|diesel|litre|liter|gas|mileage|l\/100/.test(t)){
    if(u&&truck(u)){const b=fs.byT[u];return `${u} used ${n0(b.litres14)} L of diesel in the last 14 days (${money(b.cost14)}).${b.avg?` It averages ${n1(b.avg)} L/100 km${truck(u).type==="Mixer"?`, against ${n1(fs.fleetMixer)} for the mixer fleet`:""}.`:""}`}
    const mix=S.trucks.filter(x=>x.type==="Mixer"&&fs.byT[x.id].avg).sort((a,b)=>fs.byT[b.id].avg-fs.byT[a.id].avg);
    const top=mix[0]; const wf=weekFuel();
    return `Fuel in the last 7 days: ${n0(wf.L)} L, about ${money(wf.C)}.\n\nThe heaviest user is ${top.id} at ${n1(fs.byT[top.id].avg)} L/100 km. The mixer average is ${n1(fs.fleetMixer)}, so ${top.id} is ${Math.round((fs.byT[top.id].avg/fs.fleetMixer-1)*100)}% higher. ${S.repairs.some(r=>r.truck===top.id&&r.status!=="Done")?`It also has an open repair ticket (${S.repairs.find(r=>r.truck===top.id&&r.status!=="Done").issue.toLowerCase()}), which could explain it.`:"Worth checking for leaks or long idling."}`;
  }
  if(/service|maintenance|oil|due/.test(t)){
    const due=S.trucks.map(x=>({t:x,s:serviceStatus(x)})).filter(x=>x.s.due).sort((a,b)=>a.s.left-b.s.left);
    if(!due.length)return `No trucks are within 1,500 km of their ${n0(S.serviceKm)} km service interval.`;
    return `Trucks due for service (every ${n0(S.serviceKm)} km):\n`+due.map(x=>`• ${x.t.id}: ${x.s.over?`${n0(-x.s.left)} km overdue`:`due in ${n0(x.s.left)} km`}`).join("\n");
  }
  if(/repair|broken|fix|ticket|shop|mechanic/.test(t)&&!/what do i do|break ?down|accident/.test(t)){
    const o=openRepairs(); if(!o.length)return "No open repair tickets.";
    return `${o.length} open repair ticket${o.length>1?"s":""}:\n`+o.map(r=>`• ${r.truck} (${r.priority}, ${r.status.toLowerCase()}): ${r.issue}`).join("\n");
  }
  if(/concrete|waste|returned|m3|m³|pour|yard(s)? of/.test(t)&&!/today|tomorrow|schedule/.test(t)){
    const c=concrete(dayIso(-6));
    return `Last 7 days: ${n1(c.o)} m³ ordered, ${n1(c.d)} m³ delivered and ${n1(c.r)} m³ returned. That's ${n1(c.w)}% waste.`;
  }
  if(/today|tomorrow|schedule|pour|job|load/.test(t)){
    const d=/tomorrow/.test(t)?dayIso(1):dayIso(0); const js=S.jobs.filter(j=>j.date===d).sort((a,b)=>a.time.localeCompare(b.time));
    if(!js.length)return `Nothing is scheduled for ${fmtDate(d)}.`;
    return `${fmtDate(d)}: ${js.length} pours, ${n1(js.reduce((a,j)=>a+j.ordered,0))} m³ total.\n`+js.map(j=>`• ${j.time} ${j.site}: ${n1(j.ordered)} m³ ${j.mix}, ${j.truck} with ${j.driver} (${j.status.toLowerCase()})`).join("\n");
  }
  if(/hour|hos|driving time|log/.test(t)){
    const tl=S.logs.filter(l=>l.date===dayIso(0));
    return `Today's logs so far:\n`+(tl.map(l=>`• ${l.driver}: ${n1(l.drive)} h driving, ${n1(l.duty)} h on duty${l.drive>12?" (close to the 13 h limit)":""}`).join("\n")||"none yet");
  }
  const words=t.split(/\W+/).filter(w=>w.length>3);
  let best=null,score=0; S.kb.forEach(k=>{const hay=(k.title+" "+k.body).toLowerCase();const s=words.reduce((a,w)=>a+(hay.includes(w)?1:0),0)+(/break ?down|accident|crash/.test(t)&&/breakdown/i.test(k.title)?3:0);if(s>score){score=s;best=k}});
  if(best&&score>0)return `${best.title}:\n${best.body}`;
  return "I can answer questions about fuel, service, repairs, today's pours, concrete waste, driver hours, and the company rules the admin has written. Try asking \"Which trucks are due for service?\"";
}
async function ask(q){
  q=q.trim(); if(!q||busy)return;
  chat.push({role:"user",text:q}); busy=true; render();
  if(aiMode()==="ai"){
    const rules=S.kb.map(k=>`## ${k.title}\n${k.body}`).join("\n\n");
    const instr=`You are YardDesk, the operations assistant inside ${S.company}'s yard app (a concrete and trucking company in Stoney Creek, Ontario). Employees and managers ask you about trucks, fuel, concrete pours, repairs, daily logs and company rules. Answer in plain, short sentences (under 120 words unless a list is needed), use the numbers in the data, use litres, km and m³, and say so if the data doesn't cover the question. Never invent records.\n\nCompany rules written by the admin:\n${rules}\n\nCurrent YardDesk data (JSON):\n${dataContext()}`;
    const turns=[{role:"user",content:instr}];
    chat.slice(-7,-1).forEach(m=>turns.push({role:m.role==="user"?"user":"assistant",content:m.text}));
    turns.push({role:"user",content:q});
    const bot={role:"bot",text:""}; let shown=false;
    try{
      await sampleFn(turns,{cache:false,onText:({text})=>{bot.text=text;if(!shown){chat.push(bot);shown=true;busy=false}render()}});
      if(!shown){chat.push(bot);}
    }catch(e){
      if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared"||e.code==="capability_disabled"||e.code==="capability_removed"))aiOff=true;
      const fallback=localAnswer(q);
      if(shown&&e&&e.text){bot.text=e.text+"\n\n(Answer cut short.)"}else{if(shown)chat.pop();chat.push({role:"bot",text:fallback})}
    }
    busy=false; render(); return;
  }
  setTimeout(()=>{chat.push({role:"bot",text:localAnswer(q)});busy=false;render()},350);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.nav){go(b.dataset.nav);return}
  if(b.id==="tourStart"){tourGo(0);return}
  if(b.dataset.grole){guideRole=b.dataset.grole;render();return}
  if(b.dataset.goto){if(b.dataset.asadmin&&!isAdmin()){S.role="admin";save();toast("Switched to Admin")}go(b.dataset.goto);return}
  if(b.id==="tourNext"){tourGo(tourStep+1>=TOUR.length?-1:tourStep+1);return}
  if(b.id==="tourBack"){tourGo(Math.max(0,tourStep-1));return}
  if(b.id==="tourEnd"){tourGo(-1);return}
  if(b.id==="hideWelcome"){S.hideWelcome=true;save();render();toast("Dismissed. The Guide is always in the menu.");return}
  if(b.id==="moreAlerts"){allAlerts=!allAlerts;render();return}
  if(b.id==="showWelcome"){S.hideWelcome=false;save();go("today");return}
  if(b.id==="roleDriver"){S.role="driver";if(view==="admin")view="today";save();render();toast(`Driver view: ${S.me}`);return}
  if(b.id==="roleAdmin"){S.role="admin";save();render();toast("Admin view");return}
  if(b.dataset.day){selDay=b.dataset.day;render();return}
  if(b.dataset.chk!=null){checks[CHECK_ITEMS[+b.dataset.chk]]=b.dataset.val;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));return}
  if(b.dataset.ask){ask(b.dataset.ask);return}
  if(b.id==="clearChat"){chat=[];render();return}
  if(b.dataset.deliver){const j=S.jobs.find(x=>x.id===b.dataset.deliver);const dv=parseFloat($("#del-"+j.id).value);const rt=parseFloat($("#ret-"+j.id).value);
    j.delivered=isNaN(dv)?j.ordered:dv; j.returned=isNaN(rt)?Math.max(0,+(j.ordered-j.delivered).toFixed(1)):rt; j.status="Delivered"; save(); render(); toast(`${j.truck} delivery recorded`);return}
  if(b.dataset.svc){const t=truck(b.dataset.svc);t.lastService=t.odo;save();render();toast(`${t.id} marked as serviced`);return}
  if(b.dataset.kbdel){S.kb=S.kb.filter(k=>k.id!==b.dataset.kbdel);save();render();toast("Rule removed");return}
  if(b.id==="kbAdd"){S.kb.push({id:uid(),title:"New rule",body:""});save();render();return}
  if(b.id==="resetBtn"){$("#resetConfirm").innerHTML=`<button class="btn small" type="button" id="resetYes" style="border-color:var(--bad);color:var(--bad)">Yes, reset everything</button>`;return}
  if(b.id==="resetYes"){const role=S.role;S=seed();S.role=role;chat=[];save();render();toast("Demo data reset");return}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="meSel"){S.me=el.value;save();render();toast(`Driver view: ${S.me}`);return}
  if(el.id==="fFilter"){fuelFilter=el.value;render();return}
  if(el.dataset.rstatus){const r=S.repairs.find(x=>x.id===el.dataset.rstatus);r.status=el.value;save();render();toast(`${r.truck} ticket: ${r.status}`);return}
  if(el.dataset.rcost){const r=S.repairs.find(x=>x.id===el.dataset.rcost);r.cost=+el.value||0;save();toast("Cost saved");return}
  if(el.dataset.rnote){const r=S.repairs.find(x=>x.id===el.dataset.rnote);r.note=el.value;save();toast("Note saved");return}
  if(el.dataset.kbt){S.kb.find(k=>k.id===el.dataset.kbt).title=el.value;save();toast("Rule saved");return}
  if(el.dataset.kbb){S.kb.find(k=>k.id===el.dataset.kbb).body=el.value;save();toast("Rule saved");return}
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target; const v=id=>$("#"+id).value;
  if(f.id==="askForm"){const q=v("askInput");ask(q);return}
  if(f.id==="fuelForm"){const t=truck(v("fTruck"));const odo=+v("fOdo");
    S.fuel.push({id:uid(),date:v("fDate"),truck:t.id,driver:v("fDriver"),litres:+v("fLitres"),price:+v("fPrice"),odo,station:v("fStation")});
    if(odo>t.odo)t.odo=odo; save(); fuelFilter="all"; render(); toast(`Fill-up saved for ${t.id}`);return}
  if(f.id==="repForm"){S.repairs.push({id:uid(),truck:v("rTruck"),issue:v("rIssue"),priority:v("rPri"),status:"Open",by:isAdmin()?"Admin":S.me,date:dayIso(0),cost:0,note:""});save();render();toast("Sent to the shop");return}
  if(f.id==="jobForm"){S.jobs.push({id:uid(),date:v("jDate"),time:v("jTime"),site:v("jSite"),mix:v("jMix"),truck:v("jTruck"),driver:v("jDriver"),ordered:+v("jM3"),delivered:null,returned:null,status:"Scheduled"});selDay=v("jDate");save();render();toast("Pour added to the schedule");return}
  if(f.id==="logForm"){const defects=CHECK_ITEMS.filter(c=>checks[c]==="defect");const t=truck(v("lTruck"));const end=+v("lEnd");
    S.logs.push({id:uid(),date:dayIso(0),driver:v("lDriver"),truck:t.id,drive:+v("lDrive"),duty:+v("lDuty"),startKm:+v("lStart"),endKm:end,defects,notes:v("lNotes")});
    if(end>t.odo)t.odo=end;
    defects.forEach(d=>S.repairs.push({id:uid(),truck:t.id,issue:`From daily inspection: ${d}${v("lNotes")?` (${v("lNotes")})`:""}`,priority:/Brakes|Tires|Lights/.test(d)?"high":"medium",status:"Open",by:v("lDriver"),date:dayIso(0),cost:0,note:""}));
    checks={}; save(); render(); toast(defects.length?`Log saved. ${defects.length} repair ticket${defects.length>1?"s":""} sent to the shop.`:"Log saved. Inspection passed.");return}
  if(f.id==="coForm"){S.company=v("coIn")||S.company;S.serviceKm=+v("svcIn")||S.serviceKm;save();render();toast("Settings saved");return}
  if(f.id==="truckForm"){const id=v("tId").trim().toUpperCase();if(truck(id)){toast(`${id} already exists`);return}S.trucks.push({id,type:v("tType"),cap:v("tType")==="Mixer"?10:0,odo:+v("tOdo"),lastService:+v("tOdo")});save();render();toast(`${id} added`);return}
  if(f.id==="drvForm"){const n=v("dName").trim();if(n&&!S.drivers.includes(n))S.drivers.push(n);save();render();toast(`${n} added`);return}
});
render();
})();
</script>
